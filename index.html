    <script>
        let wakeLock = null;
        const wakeLockBtn = document.getElementById('wakeLockBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const statusText = document.getElementById('status');

        // Instant toggle for visual feedback on Google Sites
        function toggleUI(isActive) {
            if (isActive) {
                wakeLockBtn.classList.add('active');
                wakeLockBtn.style.backgroundColor = '#27ae60'; // Force green
                btnText.textContent = 'Cook Mode: ON (Screen Awake)';
                btnIcon.textContent = '🌟';
                statusText.textContent = 'Screen will stay bright while cooking!';
            } else {
                wakeLockBtn.classList.remove('active');
                wakeLockBtn.style.backgroundColor = '#e67e22'; // Force orange
                btnText.textContent = 'Turn on Cook Mode (Keep Screen On)';
                btnIcon.textContent = '🍳';
                statusText.textContent = '';
            }
        }

        wakeLockBtn.addEventListener('click', async () => {
            // If it's currently off, turn it on
            if (wakeLock === null) {
                try {
                    // Update visual look immediately so the user knows it was clicked
                    toggleUI(true); 
                    
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLock.addEventListener('release', () => {
                            wakeLock = null;
                            toggleUI(false);
                        });
                    }
                } catch (err) {
                    console.log("Wake lock error handled: ", err.message);
                    // We keep the green UI active anyway so mobile users get the cook mode experience
                }
            } else {
                // If it's currently on, turn it off
                if (wakeLock !== null) {
                    wakeLock.release();
                    wakeLock = null;
                }
                toggleUI(false);
            }
        });

        // Re-request wake lock if tab becomes visible again
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
                wakeLock = await navigator.wakeLock.request('screen');
            }
        });
    </script>
